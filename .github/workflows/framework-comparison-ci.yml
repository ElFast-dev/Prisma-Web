name: Framework comparison CI

on:
  push:
    branches:
      - experiment/automated-testing
    paths:
      - "tools/framework-comparison/**"
      - "!tools/framework-comparison/**/package.json"
      - "!tools/framework-comparison/README.md"
  pull_request:
    branches:
      - experiment/framework-comparison
    paths:
      - "tools/framework-comparison/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prisma-framework-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-test:
    name: Build and test ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        framework:
          - sveltekit
          - react-router

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js and restore npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/framework-comparison/${{ matrix.framework }}/package-lock.json
            tools/framework-comparison/e2e/package-lock.json

      - name: Install framework dependencies from the committed lockfile
        run: npm ci --prefix tools/framework-comparison/${{ matrix.framework }} --no-audit --no-fund

      - name: Build framework
        run: npm run build --prefix tools/framework-comparison/${{ matrix.framework }}

      - name: Type-check React Router
        if: matrix.framework == 'react-router'
        working-directory: tools/framework-comparison/react-router
        run: npx tsc --noEmit

      - name: Measure production output
        working-directory: tools/framework-comparison
        run: |
          if [ "${{ matrix.framework }}" = "sveltekit" ]; then
            node measure.mjs sveltekit
          else
            node measure.mjs react
          fi

      - name: Install browser-test dependencies from the committed lockfile
        run: npm ci --prefix tools/framework-comparison/e2e --no-audit --no-fund

      - name: Install Chromium and operating-system dependencies
        working-directory: tools/framework-comparison/e2e
        run: npx playwright install --with-deps chromium

      - name: Run the shared browser suite for this framework
        working-directory: tools/framework-comparison/e2e
        env:
          PRISMA_FRAMEWORK: ${{ matrix.framework }}
          PLAYWRIGHT_BROWSER: chromium
        run: npm test -- --project="${{ matrix.framework }}"

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-${{ matrix.framework }}-test-report
          path: |
            tools/framework-comparison/e2e/playwright-report/
            tools/framework-comparison/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
